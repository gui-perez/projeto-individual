<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="https://kit.fontawesome.com/d840916580.js" crossorigin="anonymous"></script>
</head>
<body >
    <div class="header">

         <div class="logo">
             <img src="assets/img/logo.png" alt="Logo">
         </div>

        <div class="barra">

            <div class="b1"><a href="home.html">Home</a></div>
            <div class="b2"><a href="home.html">Sobre</a></div>
            <div class="user"><a href="login.html"><i class="fa-regular fa-user"></i>   login</a></div>

        </div>
    </div>
<img class="fundo" src="" alt="">

        <div class="container">
            
            <div class="card-login">
                <div class="logoLogin">
             <img src="assets/img/logo.png" alt="Logo">
         </div>
                
                <div class="formulario">
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="text" placeholder="digite seu email">
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="digite sua senha">
                    </div>
                    <button class="botao" onclick="entrar()"> Entrar </button>
                    <div class="msg">
                       <span>Ainda não tem uma conta?</span> <a href="cadastro.html"> Crie uma </a>
                    </div>
                </div>

            </div>
        </div>


</body>
</html>

<script>


    function entrar() {

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
           alert("Preencha todos os campos.");
            return false;
        }
        else {
            
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);



        if (
                !emailVar.includes("@") ||
                !emailVar.includes(".") ||
                emailVar.startsWith("@") ||
                emailVar.endsWith("@") ||
                emailVar.startsWith(".") ||
                emailVar.endsWith(".")
            ){
                alert(`Digite um email válido`);
            }


        if (senhaVar.length < 3) {
                alert(`Senha inválida`);
                return;
            }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                });

                 alert("Login realizado com sucesso!");
                 setTimeout(function () {
                        window.location = "dash.html";
                    }, 1000); // apenas para exibir o loading


            } 
            else {
                alert("Houve um erro ao tentar realizar o login!");
            }

        }).catch(function (erro) {
            console.log("Erro:",erro);
            alert("Erro na comunicação com servidor.")
        })

    }


</script>
