<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/cadastro.css">
    <script src="https://kit.fontawesome.com/d840916580.js" crossorigin="anonymous"></script>
</head>
<body >
    <div class="header">

         <div class="logo">
             <img src="assets/img/logo.png" alt="Logo">
         </div>

        <div class="barra">

            <div class="b1"><a href="home.html">Home</a></div>
            <div class="b2"><a href="home.html">Sobre</a></div>
            <div class="user"><a href="login.html"><i class="fa-regular fa-user"></i>   login</a></div>

        </div>
    </div>

        <div class="container">
            
            <div class="card-login">
                <div class="logoCadastro">
             <img src="assets/img/logo.png" alt="Logo">
         </div>
                
                <div class="formulario">
                    <div class="campo">
                        <span>Nome:</span>
                        <input id="nome_input" type="text" placeholder="digite seu nome">
                    </div>
                    <div class="campo">
                        <span>E-mail:</span>

                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="digite sua senha" oninput="validarSenha()" required>
                    </div>
                    <div class="campo">
                        <span>Confirmação da Senha:</span>
                        <input id="confirmacao_senha_input" type="password" placeholder="******" />
                    </div>
                    <div class="campo">
                        <span>Música favorita:</span>
                        <select id="musica_input">
                            <option value="">Selecione uma música</option>
                            <option value="1">Thriller</option>
                            <option value="2">Billie Jean</option>
                            <option value="3">Beat It</option>
                            <option value="4">Smooth Criminal</option>
                            <option value="5">Black or White</option>
                            <option value="6">Man in the Mirror</option>
                        </select>
                    </div>

                    <div class="campo">
                        <span>Fase favorita:</span>
                        <select id="fase_input">
                            <option value="">Selecione uma fase</option>
                            <option value="1">Jackson 5</option>
                            <option value="2">Off the Wall</option>
                            <option value="3">Thriller Era</option>
                            <option value="4">Bad Era</option>
                            <option value="5">Dangerous Era</option>
                            <option value="6">HIStory Era</option>
                        </select>
                    </div>

                    <div class="campo">
                        <span>Clipe favorito:</span>
                        <select id="clipe_input">
                            <option value="">Selecione um clipe</option>
                            <option value="1">Thriller</option>
                            <option value="2">Smooth Criminal</option>
                            <option value="3">Beat It</option>
                            <option value="4">Remember the Time</option>
                            <option value="5">Black or White</option>
                            <option value="6">Bad</option>
                        </select>
                    </div>

                    <div class="campo">
                        <span>Nivel fã:</span>
                        <select id="fa_input">
                            <option value="">Selecione um nivel</option>
                            <option value="1">Iniciante</option>
                            <option value="2">Casual</option>
                            <option value="3">Fã</option>
                            <option value="4">Super Fã</option>
                            <option value="5">Obcecado</option>
                            <option value="6">Michael Jackson Supremo</option>
                        </select>
                    </div>
                <button class="botao" onclick="cadastrar()">cadastrar</button>
                    <div class="msg">
                        <span>Ja tem uma conta?</span> <a href="login.html"> Entre </a>
                    </div>
                </div>

            </div>
        </div>

        
    
</body>
</html>

<script>



  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var musicaVar = musica_input.value;
    var faseVar = fase_input.value;
    var clipeVar = clipe_input.value;
    var niveVar = fa_input.value;
  

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      musicaVar == "" ||
      faseVar == "" ||
      clipeVar == "" ||
      niveVar == ""
    ) {
      alert("Preencha todos os campos!");
      return false;
    } 

    if (
            !emailVar.includes("@") ||
            !emailVar.includes(".") ||
            emailVar.startsWith("@") ||
            emailVar.endsWith("@") ||
            emailVar.startsWith(".") ||
            emailVar.endsWith(".")
        ) {
            alert("Digite um email válido.");
            return;
        }

    // verificando se a senha bate
    if (senhaVar != confirmacaoSenhaVar) {
  alert("As senhas não coincidem!");
  return false;
}

    

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        musicaServer: musicaVar,
        faseServer: faseVar,
        clipeServer: clipeVar,
        nivelServer: niveVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
         alert("Cadastro realizado com sucesso!");
          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

        } else {
          alert ("Houve um erro ao tentar realizar o cadastro!");
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        alert("Erro na comunicação com o servidor.");
      });

    return false;
  }

 

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
