<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChartJs</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/dash.css">
    <script src="https://kit.fontawesome.com/d840916580.js" crossorigin="anonymous"></script>

</head>

<body>
    <div class="header">

         <div class="logo">
             <img src="img/logo.png" alt="Logo">
         </div>

        <div class="barra">

            <div class="b1"><a href="home.html">Home</a></div>

            <div class="b2"><a href="quiz.html">quiz</a></div>
        
        </div>
    </div>

     <div class="dashboard">

        <div class="container-kpi">
            <div class="kpi">
                <div>
                    <strong>nível médio dos fãs</strong>
                    <span>3,7</span>
                    <div class="kpi-ancoragem"><strong>de 6 possível</strong></div>
                </div>
            </div>
            <div class="kpi">
                <div>
                    <strong>fase mais popular</strong>
                    <span>Thriller</span>
                    <div class="kpi-ancoragem"><strong>34% dos votos</strong></div>
                </div>
            </div>
            <div class="kpi">
                <div>
                    <strong>super fãs</strong>
                    <span>15</span>
                    <div class="kpi-ancoragem"><strong>+3 este mês</strong></div>
                </div>
            </div>
            <div class="kpi">
                <div>
                    <strong>total de fãs</strong>
                    <span>31</span>
                    <div class="kpi-ancoragem"><strong>cadastrados</strong></div>
                </div>
            </div>
        </div>

        <h1>Dashboard</h1>

        <div class="container-graficos">
            <div class="grafico">
                <canvas id="graficoMusica"></canvas>
            </div>
            <div class="grafico">
                <canvas id="graficoFase"></canvas>
            </div>
            <div class="grafico">
                <canvas id="graficoClipe"></canvas>
            </div>
            <div class="grafico">
                <canvas id="graficoNivelFa"></canvas>
            </div>
        </div>

    </div>

    <script>
        const graficoMusica = document.getElementById('graficoMusica');

new Chart(graficoMusica, {
    type: 'bar',
    data: {
        labels: ['Thriller', 'Billie Jean', 'Beat It', 'Smooth Criminal', 'Black or White', 'Man in Mirror'],
        datasets: [{
            label: 'Quantidade de votos',
            data: [9, 7, 4, 4, 4, 3],
            backgroundColor: '#ae80ed',
            borderColor: '#2F0569',
            borderWidth: 2
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            title: {
                display: true,
                text: 'Música favorita',
                color: '#ffffff',
                font: { size: 16 }
            },
            legend: {
                labels: { color: '#ffffff' }
            }
        },
        scales: {
            x: {
                title: {
                    display: true,
                    text: 'Música',
                    color: '#ffffff',
                    font: { size: 18 }
                },
                ticks: {
                    color: '#ffffff',
                    font: { size: 13 }
                }
            },
            y: {
                title: {
                    display: true,
                    text: 'Quantidade de votos',
                    color: '#ffffff',
                    font: { size: 16 }
                },
                beginAtZero: true,
                ticks: {
                    color: '#ffffff',
                    font: { size: 16 }
                }
            }
        }
    }
});

const graficoFase = document.getElementById('graficoFase');

new Chart(graficoFase, {
    type: 'bar',
    data: {
        labels: ['Jackson 5', 'Off the Wall', 'Thriller Era', 'Bad Era', 'Dangerous Era', 'HIStory Era'],
        datasets: [{
            label: 'Quantidade de votos',
            data: [2, 3, 11, 7, 5, 3],
            backgroundColor: ['#ae80ed', '#8a5fc4', '#c9a3f5', '#6b3fa0', '#d4b8f7', '#4a2070'],
            borderColor: '#2F0569',
            borderWidth: 2
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            title: {
                display: true,
                text: 'Fase favorita',
                color: '#ffffff',
                font: { size: 16 }
            },
            legend: {
                labels: { color: '#ffffff' }
            }
        },
        scales: {
            x: {
                title: {
                    display: true,
                    text: 'Fase',
                    color: '#ffffff',
                    font: { size: 18 }
                },
                ticks: {
                    color: '#ffffff',
                    font: { size: 13 }
                }
            },
            y: {
                title: {
                    display: true,
                    text: 'Quantidade de votos',
                    color: '#ffffff',
                    font: { size: 16 }
                },
                beginAtZero: true,
                ticks: {
                    color: '#ffffff',
                    font: { size: 16 }
                }
            }
        }
    }
});

const graficoClipe = document.getElementById('graficoClipe');

new Chart(graficoClipe, {
    type: 'doughnut',
    data: {
        labels: ['Thriller', 'Smooth Criminal', 'Beat It', 'Remember the Time', 'Black or White', 'Bad'],
        datasets: [{
            label: 'Quantidade de votos',
            data: [10, 7, 6, 4, 3, 1],
            backgroundColor: ['#ae80ed', '#8a5fc4', '#c9a3f5', '#6b3fa0', '#d4b8f7', '#4a2070'],
            borderColor: '#010a88',
            borderWidth: 3
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            title: {
                display: true,
                text: 'Clipe favorito',
                color: '#ffffff',
                font: { size: 16 }
            },
            legend: {
                labels: { color: '#ffffff' }
            }
        }
    }
});

const graficoNivelFa = document.getElementById('graficoNivelFa');

new Chart(graficoNivelFa, {
    type: 'line',
    data: {
        labels: ['Iniciante', 'Casual', 'Fã', 'Super Fã', 'Obcecado', 'MJ Supremo'],
        datasets: [{
            label: 'Quantidade de fãs',
            data: [2, 4, 9, 8, 5, 3],
            borderColor: '#ae80ed',
            borderWidth: 3,
            backgroundColor: 'rgba(174, 128, 237, 0.15)',
            fill: true,
            tension: 0.4
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            title: {
                display: true,
                text: 'Distribuição por nível de fã',
                color: '#ffffff',
                font: { size: 16 }
            },
            legend: {
                labels: { color: '#ffffff' }
            }
        },
        scales: {
            x: {
                title: {
                    display: true,
                    text: 'Nível',
                    color: '#ffffff',
                    font: { size: 18 }
                },
                ticks: {
                    color: '#ffffff',
                    font: { size: 13 }
                }
            },
            y: {
                title: {
                    display: true,
                    text: 'Quantidade',
                    color: '#ffffff',
                    font: { size: 16 }
                },
                beginAtZero: true,
                ticks: {
                    color: '#ffffff',
                    font: { size: 16 }
                }
            }
        }
    }
});
