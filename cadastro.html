<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/cadastro.css">
    <script src="https://kit.fontawesome.com/d840916580.js" crossorigin="anonymous"></script>
</head>
<body >
    <div class="header">

         <div class="logo">
             <img src="img/logo.png" alt="Logo">
         </div>

        <div class="barra">

            <div class="b1"><a href="home.html">Home</a></div>
            <div class="b2"><a href="home.html">Sobre</a></div>
            <div class="user"><a href="login.html"><i class="fa-regular fa-user"></i>   login</a></div>

        </div>
    </div>
<img class="fundo" src="" alt="">

        <div class="container">
            
            <div class="card-login">
                <div class="logoCadastro">
             <img src="img/logo.png" alt="Logo">
         </div>
                
                <div class="formulario">
                    <div class="campo">
                        <span>Nome:</span>
                        <input id="email_input" type="text" placeholder="digite seu nome">
                    </div>
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="text" placeholder="digite seu email">
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="digite sua senha">
                    </div>
                    <div class="campo">
                        <span>Música favorita:</span>
                        <select id="musica_input">
                            <option value="">Selecione uma música</option>
                            <option value="Thriller">Thriller</option>
                            <option value="Billie Jean">Billie Jean</option>
                            <option value="Beat It">Beat It</option>
                            <option value="Smooth Criminal">Smooth Criminal</option>
                            <option value="Black or White">Black or White</option>
                            <option value="Man in the Mirror">Man in the Mirror</option>
                        </select>
                    </div>

                    <div class="campo">
                        <span>Fase favorita:</span>
                        <select id="fase_input">
                            <option value="">Selecione uma fase</option>
                            <option value="Jackson 5">Jackson 5</option>
                            <option value="Off the Wall">Off the Wall</option>
                            <option value="Thriller Era">Thriller Era</option>
                            <option value="Bad Era">Bad Era</option>
                            <option value="Dangerous Era">Dangerous Era</option>
                            <option value="HIStory Era">HIStory Era</option>
                        </select>
                    </div>

                    <div class="campo">
                        <span>Clipe favorito:</span>
                        <select id="clipe_input">
                            <option value="">Selecione um clipe</option>
                            <option value="Thriller">Thriller</option>
                            <option value="Smooth Criminal">Smooth Criminal</option>
                            <option value="Beat It">Beat It</option>
                            <option value="Remember the Time">Remember the Time</option>
                            <option value="Black or White">Black or White</option>
                            <option value="Bad">Bad</option>
                        </select>
                    </div>
                <button class="botao" onclick="analisar()">Entrar</button>
                    <div class="msg">
                        <span>Ja tem uma conta?</span> <a href="login.html"> Entre </a>
                    </div>
                </div>

            </div>
        </div>

        
    
</body>
</html>
